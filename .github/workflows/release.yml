name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 代码检查 ──────────────────────────────────────────────────────────────────
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── 多平台编译 ────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ruproxy-linux-amd64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ruproxy-linux-arm64
            cross: true

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/ruproxy ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Release 任务 ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Prepare Archives
        run: |
          mkdir -p release_assets
          # 遍历 dist 目录下的所有二进制文件
          for file in dist/ruproxy-*; do
            if [ -f "$file" ]; then
              # 获取架构名称 (例如从 ruproxy-linux-amd64 提取 linux-amd64)
              arch=$(basename "$file" | sed 's/ruproxy-//')
              
              # 创建临时打包目录
              tmp_dir="ruproxy-${arch}"
              mkdir -p "$tmp_dir"
              
              # 1. 复制二进制并重命名为 ruproxy
              cp "$file" "$tmp_dir/ruproxy"
              # 2. 复制根目录的配置文件
              cp config.yaml "$tmp_dir/"
              
              # 3. 压缩为 tar.gz
              tar -czvf "release_assets/ruproxy-${arch}.tar.gz" -C "$tmp_dir" ruproxy config.yaml
              
              echo "Created release_assets/ruproxy-${arch}.tar.gz"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ruproxy ${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          generate_release_notes: true
          # 发布 release_assets 目录下所有的 tar.gz 文件
          files: |
            release_assets/*.tar.gz
