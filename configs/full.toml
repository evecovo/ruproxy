# Full: Hysteria2 + VLESS (TCP + Reality) running simultaneously
[log]
level = "info"

[hysteria2]
listen = "0.0.0.0:443"

[hysteria2.tls]
cert = "/etc/ssl/certs/server.crt"
key  = "/etc/ssl/private/server.key"

[hysteria2.auth]
type     = "password"
password = "change-me"

[vless]
listen = "0.0.0.0:8443"
uuid   = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[vless.tls]
type        = "reality"
private_key = "<your-x25519-private-key-base64>"
public_key  = "<your-x25519-public-key-base64>"
short_ids   = ["abcd1234"]
dest        = "example.com:443"
server_name = "example.com"
