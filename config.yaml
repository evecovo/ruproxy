log:
  level: info

# Hysteria2 (QUIC/UDP) - protocol compatible with official hysteria2 clients
hysteria2:
  enable: true
  listen: "0.0.0.0:443"
  tls:
    # Use existing cert/key, or leave empty for self-signed (dev only)
    # cert: "/etc/ssl/certs/server.crt"
    # key:  "/etc/ssl/private/server.key"
    self_signed_domain: "example.com"
  auth:
    type: password
    password: "your-strong-password-here"
  bandwidth:
    up: "100 mbps"
    down: "100 mbps"

# VLESS (TCP) - protocol compatible with Xray/v2ray clients
vless:
  enable: true
  listen: "0.0.0.0:8443"
  # Generate with: cat /proc/sys/kernel/random/uuid
  uuid: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  transport:
    # Transport type: "tcp" or "ws"
    type: tcp
    # TLS: true or false
    tls: true
    # cert/key required when tls=true; omit for self-signed (dev only)
    # cert: "/etc/ssl/certs/server.crt"
    # key:  "/etc/ssl/private/server.key"
    self_signed_domain: "example.com"
    ws_host: "your.domain.com"   # 不填则不校验 Host
    # WebSocket path (only used when type=ws)
    ws_path: "/vless"
